rules:
  preset-ja-technical-writing:
    sentence-length:
      max: 150
    max-ten:
      max: 4
    # 技術用語に長い漢字列が出やすいため無効化
    max-kanji-continuous-len: false
    arabic-kanji-numbers: true
    # design-docs は英日混在・箇条書き主体のため文体統一は不要
    no-mix-dearu-desumasu: false
    # 設計ドキュメントでは疑問形の見出しを使うことがある
    no-exclamation-question-mark: false
    no-doubled-conjunction: true
    no-doubled-joshi:
      min_interval: 1
      strict: false
    ja-no-abusage: true
    ja-no-weak-phrase: false
    no-hankaku-kana: true
    # 箇条書き・テーブル・コードブロックで誤検知が多いため無効化
    ja-no-mixed-period: false

  preset-ai-writing:
    no-ai-list-formatting:
      # "**Key**: value" はデザインドキュメントの標準構造として許容
      disableBoldListItems: true
    no-ai-hype-expressions: true
    no-ai-emphasis-patterns: true
    ai-tech-writing-guideline:
      severity: info

  # JTF スタイルガイドから数字表記ルールのみ有効化（自動修正対応）
  preset-jtf-style:
    # 有効化するルール
    "2.1.8.算用数字": true         # 全角数字 → 半角（例: ３ → 3）
    "2.2.2.算用数字と漢数字の使い分け": true  # 数量は算用数字（例: 一つ → 1つ）
    "2.2.3.一部の助数詞の表記": true          # 例: 数10倍 → 数十倍

    # 以下はすべて無効化（デザインドキュメントには不要または誤検知が多い）
    "1.1.1.本文": false
    "1.1.2.見出し": false
    "1.1.3.箇条書き": false
    "1.1.5.図表のキャプション": false
    "1.2.1.句点(。)と読点(、)": false
    "1.2.2.ピリオド(.)とカンマ(,)": false
    "2.1.2.漢字": false
    "2.1.5.カタカナ": false
    "2.1.6.カタカナの長音": false
    "2.1.9.アルファベット": false
    "2.1.10.算用数字の位取りの表記": false
    "2.2.1.ひらがなと漢字の使い分け": false
    "3.1.1.全角文字と半角文字の間": false
    "3.1.2.全角文字どうし": false
    "3.2.カタカナ語間のスペースの有無": false
    "3.3.かっこ類と隣接する文字の間のスペースの有無": false
    "4.1.1.句点(。)": false
    "4.1.3.ピリオド(.)、カンマ(,)": false
    "4.2.1.感嘆符(！)": false
    "4.2.2.疑問符(？)": false
    "4.2.4.中黒(・)": false
    "4.2.5.波線(〜)": false
    "4.2.6.ハイフン(-)": false
    "4.2.7.コロン(：)": false
    "4.2.8.セミコロン(;)": false
    "4.2.9.ダッシュ(-)": false
    "4.3.1.丸かっこ（）": false
    "4.3.2.大かっこ［］": false
    "4.3.3.かぎかっこ「」": false
    "4.3.4.二重かぎかっこ『』": false
    "4.3.5.二重引用符": false
    "4.3.6.中かっこ{ }": false
    "4.3.7.山かっこ<>": false
    "4.3.8.一重引用符": false
