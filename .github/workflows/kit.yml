name: kit

on:
  push:
    branches: [main, ja]
  pull_request:

jobs:
  smoke:
    name: template works
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Create a repository from this kit, as "Use this template" would
        run: |
          mkdir -p "$RUNNER_TEMP/user"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/user"
          cd "$RUNNER_TEMP/user"
          git init -q -b main
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "Initial commit"
          mise trust

      - name: doc:new creates a design doc from the template
        working-directory: ${{ runner.temp }}/user
        run: |
          mise run doc:new smoke
          test -f design-docs/"$(date +%F)"-smoke/README.md

      - name: kit:update overwrites kit files and leaves local/ and design docs alone
        working-directory: ${{ runner.temp }}/user
        run: |
          echo "mine" > local/CLAUDE.md
          echo "mine" > design-docs/"$(date +%F)"-smoke/README.md
          echo "changed" > REVIEW.md
          git -c user.name=ci -c user.email=ci@example.com add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm "user changes"

          git -C "$GITHUB_WORKSPACE" branch -f smoke HEAD
          KIT_REPO="file://$GITHUB_WORKSPACE" KIT_BRANCH=smoke mise run kit:update

          test "$(cat local/CLAUDE.md)" = "mine"
          test "$(cat design-docs/"$(date +%F)"-smoke/README.md)" = "mine"
          git diff --quiet -- REVIEW.md && { echo "REVIEW.md was not restored"; exit 1; }
          cmp -s REVIEW.md "$GITHUB_WORKSPACE/REVIEW.md"

      - name: kit:update refuses to run on a dirty tree
        working-directory: ${{ runner.temp }}/user
        run: |
          if KIT_REPO="file://$GITHUB_WORKSPACE" KIT_BRANCH=smoke mise run kit:update; then
            echo "expected failure on a dirty tree"; exit 1
          fi
