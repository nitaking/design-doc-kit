name: textlint

on:
  pull_request:
    paths:
      - 'design-docs/**/*.md'
      - '.textlintrc.yml'
      - '.textlintignore'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  textlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: reviewdog/action-setup@v1

      - name: Run textlint with reviewdog
        run: |
          pnpm exec textlint --format checkstyle 'design-docs/**/*.md' \
            | reviewdog -f=checkstyle -name=textlint -reporter=github-pr-review -filter-mode=added -fail-level=error
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
